remotes:
  - git_url: https://github.com/FelipeFuhr/ffreis-platform-standards
    ref: v1.6.0
    configs:
      - lefthook/base.yml
      - lefthook/python.yml
    # python.yml's pre-commit fmt-check / complex lint+coverage+integration-coverage /
    # release mutation all delegate to `make <target>` — see Makefile for
    # fmt-check, lint, coverage, coverage-gate, integration-coverage-gate, mutation.

pre-push:
  parallel: false
  commands:
    validate:
      run: make validate
