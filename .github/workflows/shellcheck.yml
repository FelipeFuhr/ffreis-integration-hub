name: DevOps / ShellCheck

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.sh"
      - "Makefile"
  push:
    branches: [main, master]


    paths:
      - "**/*.sh"
      - "Makefile"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-shellcheck.yml@main
    with:
      working-directory: .
      fail-on-error: true
      # scan-fix(public-repo-runner): pin to ubuntu-latest — this repo is public,
      # self-hosted runners can't pick up its jobs (GitHub blocks self-hosted on
      # public repos; the fleet pool is org-scoped to ffreis-org anyway).
      runner: '["ubuntu-latest"]'
