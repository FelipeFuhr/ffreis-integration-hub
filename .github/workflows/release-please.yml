name: DevOps / Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
      # scan-fix(ci:permissions-startup-failure): the nested general-release-please.yml
      # job itself requests issues:write; the caller must grant at least that or GitHub
      # rejects the workflow at startup ("requesting 'issues: write', but is only
      # allowed 'issues: none'").
      issues: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-release-please.yml@main
    with:
      # scan-fix(public-repo-runner): pin to ubuntu-latest — this repo is public,
      # self-hosted runners can't pick up its jobs (GitHub blocks self-hosted on
      # public repos; the fleet pool is org-scoped to ffreis-org anyway).
      runner: '["ubuntu-latest"]'
