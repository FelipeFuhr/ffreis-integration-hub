name: Stock Simulator Full Stack

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "examples/docker-compose.stock-sim-dashboard-agent-experiments.yml"
      - "scripts/compose.sh"
      - "Makefile"
      - "README.md"
      - ".github/workflows/stock-sim-full-stack.yml"
  schedule:
    - cron: "35 6 26 * *"  # monthly scattered (was: 40 9 * * 1)
  workflow_dispatch:
    inputs:
      agent_repo_url:
        description: "Override: https clone URL for the RL-agent companion repo (defaults to the COMPAT_REPO_URL repo variable)"
        required: false
        type: string
      agent_runtime_url:
        description: "Override: https clone URL for the agents-runtime companion repo (defaults to the COMPAT_AGENT_RUNTIME_URL repo variable)"
        required: false
        type: string


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stock-sim-full-stack:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout integration hub
        # scan-fix(ci:unpinned-action): pinned to the SHA already vetted for
        # this action elsewhere in this repo (stock-sim-dashboard-compat.yml)
        # — org policy requires full-length commit SHAs, not version tags.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Clone stock simulator/dashboard/agent repos
        env:
          # scan-fix(ci:wrong-clone-owner): the RL agent companion repo lives
          # under a different (private) owner than this public hub — an
          # earlier clone pointed at an owner/path that never existed, which
          # git reports as "could not read Username" (same failure signature
          # as a private-repo-without-auth 404). FLEET_READ_TOKEN_ORG is the
          # fine-grained PAT scoped for read access to that owner's repos.
          FLEET_READ_TOKEN_ORG: ${{ secrets.FLEET_READ_TOKEN_ORG }}
          # Both companion repos below are private; their identities must
          # not be hardcoded in this public repo's CI (fleet-wide policy).
          # Set them via: gh variable set COMPAT_REPO_URL / COMPAT_AGENT_RUNTIME_URL
          # --repo <this-repo> --body "https://github.com/<owner>/<repo>.git"
          # — optionally overridden per manual run via the workflow_dispatch inputs.
          AGENT_REPO_URL: ${{ inputs.agent_repo_url || vars.COMPAT_REPO_URL }}
          AGENT_RUNTIME_URL: ${{ inputs.agent_runtime_url || vars.COMPAT_AGENT_RUNTIME_URL }}
        run: |
          set -euo pipefail
          : "${AGENT_REPO_URL:?Set the COMPAT_REPO_URL repo variable (or pass agent_repo_url on workflow_dispatch) to the RL-agent companion repo https clone URL}"
          : "${AGENT_RUNTIME_URL:?Set the COMPAT_AGENT_RUNTIME_URL repo variable (or pass agent_runtime_url on workflow_dispatch) to the agents-runtime companion repo https clone URL}"
          git clone --depth=1 https://github.com/FelipeFuhr/ffreis-stock-simulator.git ../ffreis-stock-simulator
          git clone --depth=1 https://github.com/FelipeFuhr/ffreis-stock-simulator-dashboard-go.git ../ffreis-stock-simulator-dashboard-go
          git clone --depth=1 "https://x-access-token:${FLEET_READ_TOKEN_ORG}@${AGENT_REPO_URL#https://}" ../agent-repo
          git clone --depth=1 "https://x-access-token:${FLEET_READ_TOKEN_ORG}@${AGENT_RUNTIME_URL#https://}" ../agent-runtime

      - name: Assemble rl-agent multi-repo build context
        # scan-fix(ci:missing-path-source-sibling): the RL-agent companion
        # repo's own Containerfile COPYs from a fixed-name sibling directory
        # (`stock/ffreis-agents-runtime` — a name baked into that private
        # repo's own Containerfile, hence hardcoded here too) and
        # `stock-rl-agent-repo/{pyproject.toml,uv.lock,src}` — a hardcoded
        # local dev-workspace layout (its [tool.uv.sources] path dependency
        # is "../stock/ffreis-agents-runtime"), not the flat sibling-clone
        # layout the other clones in this workflow use. Build a small
        # directory matching what the Containerfile actually expects, since
        # a docker build context can't span the parent directory the way a
        # local checkout naturally does.
        run: |
          set -euo pipefail
          mkdir -p ../rl-agent-build-ctx/stock
          cp -r ../agent-runtime ../rl-agent-build-ctx/stock/ffreis-agents-runtime
          cp -r ../agent-repo ../rl-agent-build-ctx/stock-rl-agent-repo

      - name: Run full stack smoke
        env:
          ONLINE_TOTAL_STEPS: "120"
          OFFLINE_EPOCHS: "1"
          AGENT_REPO: ../agent-repo
        run: |
          set -euo pipefail
          make stock-sim-full-stack

      - name: Stage sibling-repo artifacts for upload
        # scan-fix(ci:relative-path-in-upload-artifact): actions/upload-artifact
        # v4 rejects any path containing ".." ("Relative pathing '.' and '..'
        # is not allowed"), so the rl-agent artifacts (which live one
        # directory above this checkout, per the sibling-clone convention)
        # must be copied inside the workspace before uploading.
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/rl-agent
          cp -r ../agent-repo/artifacts/. artifacts/rl-agent/ 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        # scan-fix(ci:unpinned-action): pinned to the SHA already vetted for
        # this action elsewhere in this repo (stock-sim-dashboard-compat.yml).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stock-sim-full-stack-artifacts-${{ github.run_id }}
          if-no-files-found: warn
          path: artifacts/
