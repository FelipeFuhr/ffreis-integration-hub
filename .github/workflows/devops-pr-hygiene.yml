name: DevOps / PR Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-pr:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-semantic-pr.yml@main
    with:
      # scan-fix(public-repo-runner): pin to ubuntu-latest — this repo is public,
      # self-hosted runners can't pick up its jobs (GitHub blocks self-hosted on
      # public repos; the fleet pool is org-scoped to ffreis-org anyway).
      runner: '["ubuntu-latest"]'

  actionlint:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-actionlint.yml@main
    with:
      working-directory: "."
      # scan-fix(public-repo-runner): pin to ubuntu-latest — public repo, self-hosted unavailable.
      runner: '["ubuntu-latest"]'

  labeler:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-labeler.yml@main
    with:
      rules-json: |-
        [
          {"label":"ci","patterns":[".github/workflows/**",".github/actions/**"]},
          {"label":"python","patterns":["**/*.py","**/pyproject.toml","**/requirements.txt"]},
          {"label":"benchmarks","patterns":["benchmarks/**"]},
          {"label":"docs","patterns":["**/*.md"]}
        ]
      # scan-fix(public-repo-runner): pin to ubuntu-latest — public repo, self-hosted unavailable.
      runner: '["ubuntu-latest"]'

