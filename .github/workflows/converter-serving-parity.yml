name: Converter Serving Parity

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "examples/docker-compose.converter-serving-parity.yml"
      - "examples/docker-compose.converter-serving-parity-grpc.yml"
      - "scripts/bench_compare_http.py"
      - "scripts/bench_compare_grpc.py"
      - "scripts/compose.sh"
      - "Makefile"
      - ".github/workflows/converter-serving-parity.yml"
  schedule:
    - cron: "42 11 4 * *"  # monthly scattered (was: 30 8 * * 1)
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converter-serving-parity:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout integration hub
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Clone sibling repos
        # scan-fix(ci:missing-sibling-checkout): the compose files under
        # examples/ build from `../../<repo>` (siblings of this checkout) —
        # ffreis-python-onnx-model-serving redirects to its renamed repo
        # ffreis-python-model-serving; clone via the new URL but keep the
        # old directory name so the compose `context:` path still resolves.
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/FelipeFuhr/ffreis-python-onnx-model-converter.git ../ffreis-python-onnx-model-converter
          git clone --depth=1 https://github.com/FelipeFuhr/ffreis-python-model-serving.git ../ffreis-python-onnx-model-serving
          git clone --depth=1 https://github.com/FelipeFuhr/ffreis-rust-onnx-model-serving.git ../ffreis-rust-onnx-model-serving

      - name: Run converter-serving parity bench (HTTP)
        run: |
          set -euo pipefail
          make smoke-converter-serving-parity

      - name: Run converter-serving parity bench (gRPC)
        run: |
          set -euo pipefail
          make smoke-converter-serving-parity-grpc

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: converter-serving-parity-artifacts-${{ github.run_id }}
          if-no-files-found: warn
          path: artifacts/
