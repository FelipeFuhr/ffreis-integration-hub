name: DevOps / Automation

on:
  schedule:
    - cron: "23 15 14 * *"  # monthly scattered (was: 0 3 * * 0)
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    if: vars.SCORECARD_ENABLED == 'true' && github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-scorecard.yml@main
    with:
      upload-sarif: true
      # scan-fix(public-repo-runner): pin to ubuntu-latest — this repo is public,
      # self-hosted runners can't pick up its jobs (GitHub blocks self-hosted on
      # public repos; the fleet pool is org-scoped to ffreis-org anyway).
      runner: '["ubuntu-latest"]'

